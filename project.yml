name: HangarVoiceLog
options:
  bundleIdPrefix: com.dfwilley
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HangarVoiceLog:
    type: application
    platform: iOS
    sources:
      - HangarVoiceLog
    info:
      path: HangarVoiceLog/Info.plist
      properties:
        CFBundleDisplayName: Hangar Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Hangar Log records your spoken maintenance notes.
        NSSpeechRecognitionUsageDescription: Hangar Log turns your recorded notes into text on this iPhone.
        NSCameraUsageDescription: Hangar Log takes photos of the work for your records.
        NSPhotoLibraryUsageDescription: Hangar Log can attach photos you already took.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dfwilley.hangarvoicelog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  HangarVoiceLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HangarVoiceLogTests
    dependencies:
      - target: HangarVoiceLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dfwilley.hangarvoicelog.tests
schemes:
  HangarVoiceLog:
    build:
      targets:
        HangarVoiceLog: all
    test:
      targets:
        - HangarVoiceLogTests
